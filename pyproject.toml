[project]
name = "arxiv2markdown"
version = "0.1.0"
description = "Convert arXiv papers to clean Markdown. Particularly useful for prompting LLMs."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Tim Farrelly", email = "timf34@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "eval_type_backport>=0.1.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.15.17",
]
server = [
    "fastapi[standard]>=0.109.1",
    "jinja2>=3.1.2",
    "uvicorn>=0.23.0",
    "slowapi>=0.1.9",
]

[project.scripts]
arxiv2md = "arxiv2md.__main__:main"

[project.urls]
homepage = "https://github.com/timf34/arxiv2md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
server = ["templates/**/*.jinja", "templates/**/*.html"]
static = ["**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["I"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "pre-commit>=4.3.0",
    "ruff>=0.15.17",
    "twine>=6.2.0",
]
